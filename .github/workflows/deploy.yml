name: Export and Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.6.2
        run: |
          wget -q --tries=3 https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.6.2-stable_linux.x86_64.zip
          mv Godot_v4.6.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Install Web export templates
        run: |
          wget -q --tries=3 https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          unzip -q Godot_v4.6.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.2.stable
          mv templates/* ~/.local/share/godot/export_templates/4.6.2.stable/
          ls ~/.local/share/godot/export_templates/4.6.2.stable/ | head -5

      - name: Generate files from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          sed "s/YOUR_FIREBASE_API_KEY/${FIREBASE_API_KEY}/" scripts/firebase_client.gd.template > scripts/firebase_client.gd
          sed "s/YOUR_FIREBASE_API_KEY/${FIREBASE_API_KEY}/" web/firebase_init.js.template > web/firebase_init.js
          echo "Generated firebase_client.gd and firebase_init.js"

      - name: Import project resources
        run: ./godot --headless --import

      - name: Export to Web
        run: |
          mkdir -p export/web
          ./godot --headless --export-release "Web" export/web/index.html
          if [ ! -f "export/web/index.html" ]; then
            echo "ERROR: export/web/index.html was not created — export failed"
            exit 1
          fi
          echo "Export successful. Files:"
          ls export/web/

      - name: Apply custom boot splash and HTML fixes
        run: |
          cp assets/boot_splash.png export/web/index.png
          sed -i 's/background-color: #242424/background-color: #1c1c21/' export/web/index.html

      - name: Inject Firebase SDK into exported HTML
        run: |
          cp web/firebase_init.js export/web/firebase_init.js
          python3 -c "
          html = open('export/web/index.html').read()
          inject = '<script crossorigin=\"anonymous\" src=\"https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js\"></script>\n<script crossorigin=\"anonymous\" src=\"https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js\"></script>\n<script crossorigin=\"anonymous\" src=\"https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js\"></script>\n<script src=\"firebase_init.js\"></script>\n'
          open('export/web/index.html', 'w').write(html.replace('</head>', inject + '</head>', 1))
          print('Firebase SDK injected')
          "

      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools@13
          firebase deploy --only hosting,firestore --token "${{ secrets.FIREBASE_TOKEN }}" --project asocijacije-hr
